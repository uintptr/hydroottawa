[workspace]
resolver = "2"
members = ["hydroottawa", "hydroottawa-api"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
anyhow = "1.0"
aws-cognito-srp = "0.2"
chrono = "0.4"
clap = { version = "4.6", features = ["derive", "env"] }
dialoguer = "0.12"
log = "0.4"
rstaples = "0.4"
rumqttc = "0.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shell-words = "1.1"
tabled = "0.21"
thiserror = "2.0"
ureq = { version = "3.4", features = ["json"] }
which = "8.0"

[workspace.lints.clippy]
arithmetic_side_effects = "warn"
expect_used = "warn"
missing_errors_doc = "allow"
needless_pass_by_ref_mut = "warn"
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
